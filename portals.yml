# Portal Scanner Configuration — Kudinov Matvii
# Junior .NET Developer | Remote | Ukraine
#
# Customize this file to add/remove companies and job boards.
# Run: /career-ops scan  to discover new offers automatically.

# -- Title filter --
# Keywords to match job titles. At least 1 positive must match.

title_filter:
  positive:
    # .NET ecosystem
    - ".NET"
    - "C#"
    - "ASP.NET"
    - "dotnet"
    - "Dot Net"
    # Backend / server-side
    - "Backend Developer"
    - "Backend Engineer"
    - "Software Developer"
    - "Software Engineer"
    - "Web Developer"
    - "Web API"
    # AI / ML integration
    - "AI Engineer"
    - "ML Engineer"
    - "Computer Vision"
    - "ONNX"
    # Junior/Trainee-friendly
    - "Junior Developer"
    - "Junior Engineer"
    - "Junior Programmer"
    - "Trainee Developer"
    - "Trainee .NET"
    - "Graduate Developer"
    - "Entry Level"
    - "Intern Developer"
  negative:
    # Exclude roles clearly not for juniors unless stated otherwise
    - "Principal"
    - "Staff"
    - "Director"
    - "VP "
    - "Head of"
    # Exclude unrelated stacks
    - "PHP"
    - "Ruby"
    - "Python Developer"
    - "Java Developer"
    - "Golang"
    - "iOS"
    - "Android"
    - "React Native"
    - "Salesforce"
    - "SAP"
    - "COBOL"
    - "Mainframe"
    - "Blockchain"
    - "Web3"
    - "Solidity"
    - "DevOps"
    - "SRE"
    - "QA Engineer"
    - "Data Analyst"
    - "Data Scientist"
  seniority_boost:
    # These help but are not required
    - "Junior"
    - "Trainee"
    - "Entry"
    - "Graduate"
    - "Mid"

# -- Location filter --
# Allow remote globally + Cherkasy. Block anything requiring on-site outside Ukraine.

location_filter:
  always_allow:
    - "Remote"
    - "Ukraine"
    - "Cherkasy"
  allow:
    - "Remote"
    - "Worldwide"
    - "Global"
    - "Anywhere"
    - "Ukraine"
    - "EU"
    - "Europe"
  block:
    - "On-site only"
    - "Must be in office"

# -- Search queries --
# WebSearch queries to discover job postings across boards.

search_queries:

  # -- Remote .NET Junior boards --
  - name: Greenhouse — Junior .NET / C#
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Junior" ".NET" OR "C#" OR "ASP.NET" remote'
    enabled: true

  - name: Ashby — .NET Backend Remote
    query: 'site:jobs.ashbyhq.com ".NET" OR "C#" OR "ASP.NET Core" backend developer remote junior'
    enabled: true

  - name: Lever — Junior .NET Remote
    query: 'site:jobs.lever.co "Junior" OR "Entry Level" ".NET" OR "C#" OR "ASP.NET" remote'
    enabled: true

  # -- General remote job boards --
  - name: WeWorkRemotely — .NET Backend
    query: 'site:weworkremotely.com ".NET" OR "C#" OR "ASP.NET" backend developer remote'
    enabled: true

  - name: Remote.co — .NET Developer
    query: 'site:remote.co ".NET" OR "C#" developer junior remote'
    enabled: true

  - name: Remotive — .NET / C#
    query: 'site:remotive.com ".NET" OR "C#" OR "ASP.NET" developer junior remote'
    enabled: true

  - name: RemoteOK — .NET / C#
    query: 'site:remoteok.com ".NET" OR "C#" backend developer junior'
    enabled: true

  - name: Himalayas — Junior .NET Remote
    query: 'site:himalayas.app ".NET" OR "C#" OR "ASP.NET" junior developer remote'
    enabled: true

  # -- Ukrainian IT job boards (Djinni = #1 for UA devs) --
  - name: Djinni — .NET Junior / Trainee
    query: 'site:djinni.co "Junior" OR "Trainee" ".NET" OR "C#" OR "ASP.NET" developer remote'
    enabled: true

  - name: Djinni — .NET C# all levels
    query: 'site:djinni.co ".NET" OR "C#" junior trainee developer 2026'
    enabled: true

  # -- European / EMEA job boards (Ukraine-friendly) --
  - name: EuRemoteJobs — .NET Backend
    query: 'site:euremotejobs.com ".NET" OR "C#" OR "ASP.NET" backend developer'
    enabled: true

  - name: NoFluffJobs — .NET (EU/Remote)
    query: 'site:nofluffjobs.com ".NET" OR "C#" OR "ASP.NET Core" junior remote OR ukraine'
    enabled: true

  - name: JustJoin.it — .NET Junior
    query: 'site:justjoin.it ".NET" OR "C#" OR "ASP.NET" junior remote'
    enabled: true

  - name: Robota.ua — .NET
    query: 'site:robota.ua ".NET" OR "C#" OR "ASP.NET" junior розробник OR developer'
    enabled: true

  - name: DOU.ua — .NET Junior
    query: 'site:jobs.dou.ua ".NET" OR "C#" OR "ASP.NET" junior'
    enabled: true

  - name: Work.ua — .NET Junior
    query: 'site:work.ua ".NET" OR "C#" backend junior розробник remote'
    enabled: true

  # -- YC / Startup boards --
  - name: YC Jobs — .NET / Backend Junior
    query: 'site:workatastartup.com ".NET" OR "C#" OR "ASP.NET" backend junior remote'
    enabled: true

  # -- AI-focused roles with .NET --
  - name: AI Jobs — .NET Integration
    query: '"AI" ".NET" OR "C#" "ONNX" OR "ML" backend developer junior remote'
    enabled: true

